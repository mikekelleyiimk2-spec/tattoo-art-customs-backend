<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 260" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="bf-lg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#477e55"/>
      <stop offset="1" stop-color="#1e4028"/>
    </linearGradient>
    <g id="bf-lf2">
      <path d="M1,0 C12,-14 30,-17 45,-6 C33,8 15,10 1,0 Z"/>
      <path d="M4,-.5 C16,-4 30,-5.5 41,-5" fill="none" stroke="#b9e356" stroke-opacity=".25" stroke-width="1.6"/>
    </g>
  </defs>

  <!-- far leaf behind -->
  <use href="#bf-lf2" fill="#122619" opacity=".8" transform="translate(58,58) rotate(102) scale(1.3)"/>

  <!-- hanging strand -->
  <path d="M62,-6 C40,50 84,96 58,150 C44,182 66,206 54,232" stroke="#2f5a3a" stroke-width="5" stroke-linecap="round"/>
  <path d="M62,-6 C42,48 82,92 57,144" stroke="#527f5e" stroke-width="1.6" opacity=".5" stroke-linecap="round"/>
  <!-- small side branch -->
  <path d="M60,96 C84,110 88,128 80,146" stroke="#26452e" stroke-width="3" stroke-linecap="round"/>
  <!-- end curl -->
  <path d="M54,232 c-10,10 -22,2 -16,-8 c4,-8 15,-6 15,2" stroke="#2f5a3a" stroke-width="2.6" stroke-linecap="round"/>

  <g fill="url(#bf-lg2)">
    <use href="#bf-lf2" transform="translate(57,38) rotate(38) scale(.85)"/>
    <use href="#bf-lf2" transform="translate(61,82) rotate(158) scale(.8)"/>
    <use href="#bf-lf2" transform="translate(55,126) rotate(30) scale(.7)"/>
    <use href="#bf-lf2" transform="translate(59,170) rotate(150) scale(.65)"/>
    <use href="#bf-lf2" transform="translate(81,140) rotate(62) scale(.6)"/>
  </g>

  <!-- ember glint -->
  <circle cx="30" cy="120" r="8" fill="#ff9a3c" opacity=".10"/>
  <circle cx="30" cy="120" r="3" fill="#ff9a3c" opacity=".45"/>
  <circle cx="88" cy="196" r="2.2" fill="#b9e356" opacity=".3"/>
</svg>
