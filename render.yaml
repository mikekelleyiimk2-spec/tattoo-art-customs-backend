# Render Blueprint — one-click deploy for Tattoo Art Customs.
# In Render: New > Blueprint > point at the repo containing this file.
services:
  - type: web
    name: tattoo-art-customs
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: tac-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: tattoo-art-customs-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: BASE_URL
        value: https://tattoo-art-customs.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FEEDBACK_EMAIL
        value: mikekelleyii.mk2@gmail.com
      - key: PAYPAL_MODE
        value: live
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ADSENSE_PUBLISHER_ID
        value: ca-pub-9088514263110417
      - key: APPLE_PAY_DOMAIN_ASSOCIATION
        sync: false
      - key: PAYPAL_PLAN_CUSTOMER
        sync: false
      - key: PAYPAL_PLAN_ARTIST
        sync: false
      - key: PAYPAL_PLAN_SHOP
        sync: false
      - key: PAYPAL_PLAN_CUSTOMER_ANNUAL
        sync: false
      # Dawnfold publication plans (created by
      # scripts/create-dawnfold-plans.js in the Render shell; the same
      # 5 IDs also go on the OneMind standalone service).
      - key: PAYPAL_PLAN_THE_BIG_ONE
        sync: false
      - key: PAYPAL_PLAN_THE_BIG_ONE_ANNUAL
        sync: false
      - key: PAYPAL_PLAN_THE_BIG_ONE_FOUNDING
        sync: false
      - key: PAYPAL_PLAN_THE_BIG_ONE_SUPPORTER
        sync: false
      - key: PAYPAL_PLAN_THE_BIG_ONE_WAITING_ROOM
        sync: false
      # Muse service pipe token (guards /api/muse/*; endpoints 404
      # while unset). Value lives only in the dashboard + the VM
      # secrets store — never in the repo.
      - key: MUSE_SERVICE_TOKEN
        sync: false
      - key: FOUNDING_SHOP_WINDOW_END
        value: 2027-03-01
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: STORAGE_PROVIDER
        value: local
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_BUCKET
        sync: false
      - key: R2_PRIVATE_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: WISE_API_TOKEN
        sync: false
      - key: WISE_PROFILE_ID
        sync: false
      # AI Master Button API lane (slices 1-2): server-side provider
      # keys ONLY — customers never see or enter keys. Values are set
      # in the Render dashboard when the owner creates each provider
      # account.
      - key: API_LANE_ENABLED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: META_MODEL_API_KEY
        sync: false

  # Brambleforce online co-op relay (design doc 2026-10-31 §2):
  # dedicated always-on Starter ($7/mo, owner-approved 2026-10-31) so
  # co-op sessions never share a fate with the store's deploys. Code
  # lives in relay/ in this repo. Can also be created by hand in the
  # dashboard as a Web Service on this repo with Root Directory
  # "relay" — same build/start commands and plan.
  - type: web
    name: brambleforce-relay
    runtime: node
    plan: starter
    rootDir: relay
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Seat validation for the player pool: full URL of the store
      # backend's seat check (GET, x-api-token header). Set in the
      # dashboard to https://tattoo-art-customs.onrender.com/api/onemind/seat
      # — while unset the relay runs safe: pool CLOSED, code-join only.
      - key: RELAY_SEAT_CHECK_URL
        sync: false

databases:
  - name: tattoo-art-customs-db
    plan: basic-256mb
